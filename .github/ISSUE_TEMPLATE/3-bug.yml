name: Bug
description: Something broke or didn't happen, with no Lua error (pop-up, equip, bag arrows, tooltip, options).
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Put a [Some Item] in your bags
        2. Click the upgrade pop-up
        3. ...
  - type: input
    id: version
    attributes:
      label: GearSentry version
    validations:
      required: true
  - type: input
    id: character
    attributes:
      label: Class / spec / level
  - type: textarea
    id: addons
    attributes:
      label: Other bag or tooltip addons
      description: E.g. BetterBags, Bagnon, TipTac. "None" is a fine answer. If the bug goes away with them disabled, say so.
